name: Backend checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.19.0'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '11.25.0'
      - run: pnpm install --frozen-lockfile
      - name: Validate production deployment template
        run: docker compose --env-file deploy/.env.example -f deploy/compose.yaml config --no-env-resolution --quiet
      - name: Start isolated local test services
        run: |
          docker compose up -d
          for attempt in $(seq 1 30); do
            if docker exec ortak-drive-dev-mongo-1 mongosh --port 27018 --quiet --eval 'if (!db.hello().isWritablePrimary) quit(1)'; then exit 0; fi
            sleep 2
          done
          exit 1
      - run: pnpm check
      - run: pnpm test
      - run: pnpm audit --prod
      - run: docker build -t ortak-drive-api:ci .
      - if: always()
        run: docker compose down
