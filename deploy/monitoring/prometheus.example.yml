global:
  scrape_interval: 30s
rule_files: ['/etc/prometheus/alerts.yml']
scrape_configs:
  - job_name: ortak-drive
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/drive_operations_token
    static_configs:
      - targets: ['api:4100']
# Mount the token file read-only. Join the private edge network; never publish /metrics.
# Configure alertmanager and the team's notification destination before live release.
