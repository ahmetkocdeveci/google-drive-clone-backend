name: ortak-drive-dev
services:
  mongo:
    image: mongo:8.0
    command: [mongod, --replSet, rs0, --bind_ip_all, --port, '27018']
    ports: ['127.0.0.1:27018:27018']
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: ['CMD', mongosh, --port, '27018', --quiet, --eval, 'db.adminCommand({ping:1}).ok']
      interval: 5s
      timeout: 3s
      retries: 30
  mongo-init:
    image: mongo:8.0
    network_mode: service:mongo
    depends_on:
      mongo: {condition: service_healthy}
    entrypoint: [mongosh, --port, '27018', --quiet, --eval]
    command:
      - 'try { rs.status() } catch(e) { rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27018"}]}) }'
    restart: 'no'
  mailpit:
    image: axllent/mailpit:v1.31.6
    ports: ['127.0.0.1:1025:1025', '127.0.0.1:8025:8025']
volumes:
  mongo-data:
